<svg xmlns="http://www.w3.org/2000/svg" width="920" height="200" viewBox="0 0 920 200" role="img" aria-label="signal map pipeline">
  <rect width="920" height="200" rx="12" fill="#0B1220"/>
  <rect x="1" y="1" width="918" height="198" rx="11" fill="none" stroke="#1E293B" stroke-width="2"/>

  <text x="24" y="28" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#64748B">SIGNAL.MAP // pipeline</text>

  <!-- nodes -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="40" y="70" width="140" height="52" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="2"/>
    <text x="110" y="102" fill="#E2E8F0">IDEA</text>

    <rect x="270" y="70" width="140" height="52" rx="8" fill="#111827" stroke="#818CF8" stroke-width="2"/>
    <text x="340" y="102" fill="#E2E8F0">BUILD</text>

    <rect x="500" y="70" width="140" height="52" rx="8" fill="#111827" stroke="#67E8F9" stroke-width="2"/>
    <text x="570" y="102" fill="#E2E8F0">SHIP</text>

    <rect x="730" y="70" width="140" height="52" rx="8" fill="#111827" stroke="#A5B4FC" stroke-width="2"/>
    <text x="800" y="102" fill="#E2E8F0">PROD</text>
  </g>

  <!-- forward arrows -->
  <g fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round">
    <path d="M185 96 H255"/>
    <path d="M245 90 L255 96 L245 102" fill="#64748B" stroke="none"/>
    <path d="M415 96 H485"/>
    <path d="M475 90 L485 96 L475 102" fill="#64748B" stroke="none"/>
    <path d="M645 96 H715"/>
    <path d="M705 90 L715 96 L705 102" fill="#64748B" stroke="none"/>
  </g>

  <!-- feedback loop -->
  <path d="M800 122 V155 H110 V122" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M118 130 L110 122 L102 130" fill="#475569" stroke="none"/>
  <text x="460" y="175" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#64748B">
    feedback (blame DNS first)
  </text>

  <!-- pulse on IDEA border -->
  <rect x="40" y="70" width="140" height="52" rx="8" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
