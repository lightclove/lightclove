<svg xmlns="http://www.w3.org/2000/svg" width="420" height="56" viewBox="0 0 420 56">
  <rect width="420" height="56" rx="8" fill="#070b12" stroke="#00F0FF" stroke-width="1.5">
    <animate attributeName="stroke" values="#00F0FF;#FF2D95;#39FF14;#00F0FF" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="28" cy="28" r="7" fill="#39FF14">
    <animate attributeName="opacity" values="1;0.25;1" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="6;8;6" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="24" font-family="Consolas, monospace" font-size="13" fill="#39FF14">STATUS // ONLINE</text>
  <text x="48" y="42" font-family="Consolas, monospace" font-size="11" fill="#00F0FF">
    neon_core=ACTIVE · latency&lt;1ms
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
  </text>
</svg>
