<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="14" fill="#0B1220"/>
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="10" y="10" width="1180" height="300" rx="10" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.2;0.55;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- subtle grid -->
  <g stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 64 H1200 M0 128 H1200 M0 192 H1200 M0 256 H1200"/>
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320"/>
  </g>

  <!-- scan beam -->
  <rect x="0" width="1200" height="18" fill="#38BDF8" opacity="0.08">
    <animate attributeName="y" values="0;302;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="125" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="64" font-weight="700" fill="#38BDF8">LIGHTCLOVE</text>
  <text x="603" y="125" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="64" font-weight="700" fill="#818CF8" opacity="0.35">
    LIGHTCLOVE
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="170" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#94A3B8" letter-spacing="2">
    PYTHON / RUST  |  BACKEND / FULLSTACK
  </text>
  <text x="600" y="210" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#67E8F9">
    &gt; boot OK  |  neon_core=ONLINE  |  caffeine=CRITICAL
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="250" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#A5B4FC">
    [joke] works on my machine (tm) -- shipped as Docker
    <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.28;0.33;0.66;0.66;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="250" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#A5B4FC">
    [joke] RAG = Retrieval-Augmented Guessing (with citations)
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.61;0.66;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="250" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#A5B4FC">
    [joke] Rust: fearless concurrency / fearful of borrow checker
    <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.66;0.66;0.66;0.71;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <circle cx="36" cy="36" r="5" fill="#34D399">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="40" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#34D399">LINK LIVE</text>
  <text x="980" y="40" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#64748B">bugs=features++</text>
</svg>
