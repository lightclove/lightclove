<svg xmlns="http://www.w3.org/2000/svg" width="920" height="150" viewBox="0 0 920 150">
  <rect width="920" height="150" rx="6" fill="#070b12" stroke="#00F0FF" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="20" y="28" fill="#00F0FF">&gt; sudo make coffee &amp;&amp; cargo build --release</text>
    <text x="20" y="52" fill="#39FF14">
      [OK] python fastapi postgres docker -- stack assembled
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="20" y="76" fill="#FF2D95">
      [WARN] found 1 bug -- promoted to feature (LGTM)
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </text>
    <text x="20" y="100" fill="#B026FF">
      [OK] unit tests: 42 passed / 0 failed / 1 skipped (flaky, not me)
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </text>
    <text x="20" y="128" fill="#00F0FF">
      READY_ to ship (and apologize in the changelog)_
      <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="0" y="0" width="920" height="3" fill="#39FF14" opacity="0.55">
    <animate attributeName="y" values="0;147;0" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>
