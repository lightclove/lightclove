<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF2D95" stop-opacity="1"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="48" fill="#070b12"/>
  <line x1="0" y1="24" x2="1200" y2="24" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1"/>
  <rect width="180" height="4" y="22" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="x" values="-180;1200" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="16" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#00F0FF">
    ==== SCANNING FOR BUGS (hiding when HR looks) ====
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
  </text>
</svg>
