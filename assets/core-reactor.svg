<svg xmlns="http://www.w3.org/2000/svg" width="280" height="290" viewBox="0 0 280 290">
  <rect width="280" height="290" fill="#070b12"/>
  <g transform="translate(140,130)" fill="none" stroke-width="2">
    <circle r="110" stroke="#00F0FF" stroke-opacity="0.25"/>
    <circle r="85" stroke="#FF2D95" stroke-opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="60" stroke="#39FF14" stroke-opacity="0.45" stroke-dasharray="8 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" stroke="#B026FF" stroke-opacity="0.7">
      <animate attributeName="r" values="24;34;24" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#00F0FF" stroke="none">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
      <circle cx="85" cy="0" r="5" fill="#FF2D95"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="8s" repeatCount="indefinite"/>
      <circle cx="60" cy="0" r="4" fill="#39FF14"/>
    </g>
  </g>
  <text x="140" y="255" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#00F0FF">CORE REACTOR</text>
  <text x="140" y="275" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#FF2D95">
    powered by coffee + spite
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
