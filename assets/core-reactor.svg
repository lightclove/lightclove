<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <rect width="260" height="260" rx="12" fill="#0B1220"/>
  <g transform="translate(130,120)" fill="none" stroke-width="2">
    <circle r="95" stroke="#1E293B"/>
    <circle r="72" stroke="#38BDF8" stroke-opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" stroke="#818CF8" stroke-opacity="0.55" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#38BDF8" stroke="none">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <circle cx="72" cy="0" r="4" fill="#818CF8"/>
    </g>
  </g>
  <text x="130" y="235" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#94A3B8">CORE REACTOR</text>
  <text x="130" y="250" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#64748B">coffee + spite</text>
</svg>
